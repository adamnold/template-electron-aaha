name: Release template
# Manual-only: validates the scaffold at the commit a draft release targets,
# attaches a `git archive` of that commit with a SHA256SUMS file, then
# publishes the draft. Never runs on push or pull requests. Generated apps do
# not inherit this workflow; new-app.sh gives them templates/app-release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to package and publish (for example v2.1.1)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve draft release target
        id: target
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [[ "$draft" == "true" ]] || { echo "$TAG is not a draft release" >&2; exit 1; }
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .target_commitish")"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Confirm package version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm ci
      - run: npm run check:template
      - run: npm test
      - name: Package, attach, and publish
        run: |
          set -euo pipefail
          archive="webapp-wrapper-aaha-$TAG.tar.gz"
          sums="webapp-wrapper-aaha-$TAG-SHA256SUMS"
          git archive --format=tar.gz -o "$archive" HEAD
          sha256sum "$archive" > "$sums"
          sha256sum -c "$sums"
          gh release upload "$TAG" "$archive" "$sums" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
